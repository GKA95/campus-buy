    <script>
      // Suppress internal browser extension timeouts and foreign chrome-extension errors from leaking as app crashes
      window.addEventListener('error', function(e) {
        if (
          (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
          (e.message && (e.message.indexOf('chrome: call method') !== -1 || e.message.indexOf('timed out') !== -1))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('chrome: call method') !== -1 || msg.indexOf('chrome-extension://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
